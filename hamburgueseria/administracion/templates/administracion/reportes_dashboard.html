<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Mama Grande</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'negro-principal': '#111111',
                        'gris-oscuro': '#1C1C1C',
                        'gris-medio': '#AAAAAA',
                        'blanco': '#FFFFFF',
                        'rojo-intenso': '#B51E23',
                        'rojo-suave': '#D9322A',
                        'gris-claro': '#E0E0E0'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
        }

        .grid-bg {
            background-image: 
                linear-gradient(rgba(181, 30, 35, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(181, 30, 35, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .chart-card {
            position: relative;
            overflow: hidden;
        }

        .chart-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(181, 30, 35, 0.05), transparent);
            transition: left 0.6s ease;
        }

        .chart-card:hover::before {
            left: 100%;
        }

        .header-gradient {
            background: linear-gradient(135deg, #1C1C1C 0%, #111111 100%);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        .corner-decoration {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid #B51E23;
            opacity: 0.15;
        }

        .corner-decoration.top-left {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
        }

        .corner-decoration.bottom-right {
            bottom: 15px;
            right: 15px;
            border-left: none;
            border-top: none;
        }

        .glow-text {
            text-shadow: 0 0 20px rgba(181, 30, 35, 0.3);
        }

        canvas {
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }
    </style>
</head>
<body class="bg-negro-principal min-h-screen grid-bg">
    
    <!-- Header -->
    <header class="header-gradient border-b border-gris-medio/20 sticky top-0 z-40 backdrop-blur-sm">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3" id="header-title">
                    <div class="w-10 h-10 bg-gradient-to-br from-rojo-intenso to-rojo-suave rounded-xl flex items-center justify-center floating">
                        <svg class="w-6 h-6 text-blanco" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-black text-blanco">{{ titulo }}</h1>
                        <p class="text-gris-medio text-xs font-medium">Análisis y Estadísticas</p>
                    </div>
                </div>
                <a href="{% url 'administracion:dashboard' %}" class="bg-gris-oscuro hover:bg-gris-medio/20 text-blanco font-bold px-5 py-2.5 rounded-xl transition-all duration-300 border border-gris-medio/20 hover:border-rojo-intenso/50 flex items-center gap-2 group">
                    <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    <span class="text-sm">Volver</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8 relative z-10">
        
        <!-- Stats Summary -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8" id="stats-summary">
            <!-- Summary Card 1 -->
            <div class="bg-gris-oscuro rounded-xl p-6 border border-gris-medio/10 relative overflow-hidden group hover:border-rojo-intenso/30 transition-all duration-300">
                <div class="absolute top-0 right-0 w-32 h-32 bg-rojo-intenso/5 rounded-bl-full"></div>
                <div class="relative z-10">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-10 h-10 bg-rojo-intenso/10 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-rojo-intenso" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <h3 class="text-lg font-bold text-blanco">Total de Ventas</h3>
                    </div>
                    <p class="text-gris-medio text-sm">Resumen de ingresos por categoría</p>
                </div>
            </div>

            <!-- Summary Card 2 -->
            <div class="bg-gris-oscuro rounded-xl p-6 border border-gris-medio/10 relative overflow-hidden group hover:border-rojo-intenso/30 transition-all duration-300">
                <div class="absolute top-0 right-0 w-32 h-32 bg-rojo-intenso/5 rounded-bl-full"></div>
                <div class="relative z-10">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-10 h-10 bg-rojo-intenso/10 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-rojo-intenso" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                            </svg>
                        </div>
                        <h3 class="text-lg font-bold text-blanco">Estados de Pedidos</h3>
                    </div>
                    <p class="text-gris-medio text-sm">Distribución de pedidos por estado</p>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- Chart 1: Ventas por Categoría -->
            <div class="chart-card bg-gris-oscuro rounded-xl p-6 border border-gris-medio/10 relative group" id="chart1">
                <div class="corner-decoration top-left"></div>
                <div class="corner-decoration bottom-right"></div>
                <div class="relative z-10">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-2 h-8 bg-gradient-to-b from-rojo-intenso to-rojo-suave rounded-full"></div>
                        <h2 class="text-xl font-black text-blanco glow-text">Ventas por Categoría</h2>
                    </div>
                    <div class="bg-negro-principal/50 rounded-lg p-4">
                        <canvas id="ventasCategoria"></canvas>
                    </div>
                </div>
            </div>

            <!-- Chart 2: Pedidos por Estado -->
            <div class="chart-card bg-gris-oscuro rounded-xl p-6 border border-gris-medio/10 relative group" id="chart2">
                <div class="corner-decoration top-left"></div>
                <div class="corner-decoration bottom-right"></div>
                <div class="relative z-10">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-2 h-8 bg-gradient-to-b from-rojo-intenso to-rojo-suave rounded-full"></div>
                        <h2 class="text-xl font-black text-blanco glow-text">Pedidos por Estado</h2>
                    </div>
                    <div class="bg-negro-principal/50 rounded-lg p-4">
                        <canvas id="pedidosEstado"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Parseamos los datos JSON seguros
        const categorias = JSON.parse('{{ categorias|escapejs }}');
        const totales = JSON.parse('{{ totales|escapejs }}');
        const estados = JSON.parse('{{ estados|escapejs }}');
        const totalesEstados = JSON.parse('{{ totales_estados|escapejs }}');

        // Configuración de colores del tema
        const coloresGradiente = [
            'rgba(181, 30, 35, 0.8)',    // rojo-intenso
            'rgba(217, 50, 42, 0.8)',    // rojo-suave
            'rgba(224, 224, 224, 0.8)',  // gris-claro
            'rgba(170, 170, 170, 0.8)',  // gris-medio
            'rgba(28, 28, 28, 0.8)'      // gris-oscuro
        ];

        const coloresBorde = [
            'rgba(181, 30, 35, 1)',
            'rgba(217, 50, 42, 1)',
            'rgba(224, 224, 224, 1)',
            'rgba(170, 170, 170, 1)',
            'rgba(28, 28, 28, 1)'
        ];

        // Configuración global de Chart.js para tema oscuro
        Chart.defaults.color = '#AAAAAA';
        Chart.defaults.borderColor = 'rgba(170, 170, 170, 0.1)';
        Chart.defaults.font.family = "'Inter', sans-serif";

        // -----------------------------
        // Gráfico de ventas por categoría
        // -----------------------------
        new Chart(document.getElementById("ventasCategoria"), {
            type: "bar",
            data: {
                labels: categorias,
                datasets: [{
                    label: "Ventas (Bs)",
                    data: totales,
                    backgroundColor: coloresGradiente,
                    borderColor: coloresBorde,
                    borderWidth: 2,
                    borderRadius: 8,
                    borderSkipped: false,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { 
                        position: 'top',
                        labels: {
                            color: '#FFFFFF',
                            font: {
                                size: 12,
                                weight: 'bold'
                            },
                            padding: 15
                        }
                    },
                    title: { 
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(28, 28, 28, 0.95)',
                        titleColor: '#FFFFFF',
                        bodyColor: '#AAAAAA',
                        borderColor: 'rgba(181, 30, 35, 0.5)',
                        borderWidth: 1,
                        padding: 12,
                        displayColors: true,
                        callbacks: {
                            label: function(context) {
                                return ' ' + context.parsed.y.toFixed(2) + ' Bs';
                            }
                        }
                    }
                },
                scales: {
                    y: { 
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(170, 170, 170, 0.1)',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#AAAAAA',
                            font: {
                                size: 11
                            }
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#AAAAAA',
                            font: {
                                size: 11
                            }
                        }
                    }
                }
            }
        });

        // -----------------------------
        // Gráfico de pedidos por estado
        // -----------------------------
        new Chart(document.getElementById("pedidosEstado"), {
            type: "doughnut",
            data: {
                labels: estados,
                datasets: [{
                    label: "Pedidos",
                    data: totalesEstados,
                    backgroundColor: coloresGradiente,
                    borderColor: coloresBorde,
                    borderWidth: 2,
                    hoverOffset: 15
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { 
                        position: 'bottom',
                        labels: {
                            color: '#FFFFFF',
                            font: {
                                size: 12,
                                weight: 'bold'
                            },
                            padding: 15,
                            usePointStyle: true,
                            pointStyle: 'circle'
                        }
                    },
                    title: { 
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(28, 28, 28, 0.95)',
                        titleColor: '#FFFFFF',
                        bodyColor: '#AAAAAA',
                        borderColor: 'rgba(181, 30, 35, 0.5)',
                        borderWidth: 1,
                        padding: 12,
                        displayColors: true,
                        callbacks: {
                            label: function(context) {
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percentage = ((context.parsed / total) * 100).toFixed(1);
                                return ' ' + context.parsed + ' pedidos (' + percentage + '%)';
                            }
                        }
                    }
                }
            }
        });

        // Animaciones de entrada
        document.addEventListener('DOMContentLoaded', () => {
            // Animación del header
            anime({
                targets: '#header-title',
                opacity: [0, 1],
                translateY: [-20, 0],
                duration: 600,
                easing: 'easeOutExpo'
            });

            // Animación de las tarjetas de resumen
            anime({
                targets: '#stats-summary > div',
                opacity: [0, 1],
                translateY: [40, 0],
                scale: [0.9, 1],
                duration: 600,
                delay: anime.stagger(120, {start: 300}),
                easing: 'easeOutExpo'
            });

            // Animación de los gráficos
            anime({
                targets: '#chart1, #chart2',
                opacity: [0, 1],
                translateY: [60, 0],
                scale: [0.95, 1],
                duration: 800,
                delay: anime.stagger(150, {start: 600}),
                easing: 'easeOutExpo'
            });

            // Animación de las decoraciones
            anime({
                targets: '.corner-decoration',
                opacity: [0, 0.15],
                scale: [0.5, 1],
                duration: 1000,
                delay: anime.stagger(50, {start: 1000}),
                easing: 'easeOutExpo'
            });
        });
    </script>
</body>
</html>
